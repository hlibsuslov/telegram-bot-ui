# Optional Codex (OpenAI) skill metadata.
# The core SKILL.md works across Claude Code, Codex, and other Agent Skills
# hosts unchanged; this file only adds Codex-specific presentation/policy and is
# ignored by hosts that don't use it. Schema per Codex "Build skills" docs.
interface:
  display_name: "Telegram Bot UI"
  short_description: >-
    Design and build Telegram bot interfaces and the Bot API 10.3/10.4
    features behind them: texts, keyboards, disabled buttons and force_reply
    forms, streaming AI answers with Stop, private ephemeral panels in groups,
    Rich Messages, HTML widgets and TON wallet flows, topics, formatting and
    localization - with the update routing, state, retries and SDK adapters
    they need. Preserves callback_data, deep links, handlers, and translations.

policy:
  # Allow the model to select this skill automatically when a prompt matches the
  # description (same intent as Claude Code auto-activation).
  allow_implicit_invocation: true
