# Optional Codex (OpenAI) skill metadata.
# The core SKILL.md works across Claude Code, Codex, and other Agent Skills
# hosts unchanged; this file only adds Codex-specific presentation/policy and is
# ignored by hosts that don't use it. Schema per Codex "Build skills" docs.
interface:
  display_name: "Telegram Rich Messages"
  short_description: >-
    Produce Telegram's editor-style rich formatting — above all TABLES — for bot,
    channel, and broadcast messages (Rich Markdown/HTML, InputRichBlockTable,
    sendRichMessage); then audit, migrate, debug, and test all other formatting:
    HTML, MarkdownV2, entities, media, splitting, streaming drafts, editing, RTL.

policy:
  # Allow the model to select this skill automatically when a prompt matches the
  # description (same intent as Claude Code auto-activation).
  allow_implicit_invocation: true
