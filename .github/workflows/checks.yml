name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node >= 22.18 runs the .ts tests through type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The lockfiles are written by npm 11; npm 10 (bundled with Node 22) reads the optional wasm peers
      # of studio/web's lockfile differently and refuses `npm ci`. Node stays 22, the oldest supported.
      - name: npm that wrote the lockfiles
        run: npm install -g npm@11.6.2

      - name: Adapters are in sync with skills/telegram-bot-ui/SKILL.md and adapters/routing.json
        run: python scripts/build_adapters.py --check

      - name: Eval files are valid
        run: python scripts/run_evals.py

      - name: Pinned SDKs for the contract tests
        run: |
          python -m pip install --disable-pip-version-check -r skills/telegram-bot-ui/examples/python/sdk_aiogram/requirements.txt
          npm ci --prefix skills/telegram-bot-ui/examples/ts/sdk-grammy --ignore-scripts

      # The Studio's own Node tests and the single-file client that `export-snapshot` and the MCP
      # `map_snapshot` tool embed; without them those tests skip.
      - name: Studio client for its tests and the snapshot export
        run: |
          npm ci --prefix studio/web --ignore-scripts
          npm run build:artifact --prefix studio/web

      # Validators, unittest suite (tests/test_*.py) and every Node test under the skill examples/.
      - name: All offline checks
        run: python scripts/run_checks.py

      - name: Installer dry run against a temporary folder
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python scripts/install.py --host all --scope project --project "$tmp" --home "$tmp/home" --with-instructions --dry-run
          test -z "$(ls -A "$tmp")"
